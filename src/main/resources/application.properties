spring.application.name=projectzest

# ---- Server ----
server.port=${SERVER_PORT:8080}

# ---- Database (MySQL) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zestdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# IMPORTANT: override JWT_SECRET via an environment variable in real use - never
# commit a real production secret here. This default is for local dev only.
app.jwt.secret=${JWT_SECRET:this-is-a-dev-only-secret-key-change-me-please-32chars+}
app.jwt.access-token-expiration-ms=${JWT_EXPIRATION:900000}
app.jwt.refresh-token-expiration-ms=${REFRESH_TOKEN_EXPIRATION:604800000}

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Actuator ----
management.endpoints.web.exposure.include=health

# ---- Logging ----
logging.level.com.example.projectzest=DEBUG
